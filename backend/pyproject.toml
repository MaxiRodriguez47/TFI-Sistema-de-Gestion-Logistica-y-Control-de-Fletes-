[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
# B008: FastAPI usa Depends()/Query() como valor por defecto (patrón oficial).
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
# En conftest hay que fijar DATABASE_URL antes de importar la app.
"tests/conftest.py" = ["E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
